version: '3.8'

services:
  # ==========================================
  # 1. MySQL Database Service
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: blood_donation_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Adil@1267}
      MYSQL_DATABASE: ${DB_NAME:-blood_donation_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blood_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 2. Express Node.js API Backend
  # ==========================================
  bloodify:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blood_donation_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Adil@1267}
      DB_NAME: ${DB_NAME:-blood_donation_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_blood_donation_jwt_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_GOOGLE_EMAIL: ${ADMIN_GOOGLE_EMAIL:-adilh5353@gmail.com}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - blood_network

volumes:
  mysql_data:
    name: blood_donation_mysql_data

networks:
  blood_network:
    driver: bridge
