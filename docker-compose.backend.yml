version: '3.8'

services:
  # ==========================================
  # 1. Express Node.js API Backend
  # ==========================================
  bloodify:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blood_donation_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-sql.daruntech.cloud}
      DB_PORT: ${DB_PORT:-12345}
      DB_USER: ${DB_USER:-darun_for_donors_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-darun_for_donors}
      JWT_SECRET: ${JWT_SECRET:-super_secret_blood_donation_jwt_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_GOOGLE_EMAIL: ${ADMIN_GOOGLE_EMAIL:-adilh5353@gmail.com,daruntech.pvt.ltd@gmail.com}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - blood_network

networks:
  blood_network:
    driver: bridge
